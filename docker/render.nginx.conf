worker_processes 1;
pid __STATE__/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    client_body_temp_path __STATE__/client;
    proxy_temp_path __STATE__/proxy;
    fastcgi_temp_path __STATE__/fastcgi;
    uwsgi_temp_path __STATE__/uwsgi;
    scgi_temp_path __STATE__/scgi;
    client_max_body_size 16k;

    server {
        listen 0.0.0.0:__PORT__;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_set_header Host $host;
        }

        location = /ws {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_buffering off;
        }
    }
}
